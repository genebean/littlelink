<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>GeneBean's Links</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Links to GeneBean on various apps and platforms">

    <!-- Keywords -->
    <meta name="keywords" content="GeneBean TuxDroid">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://genebean.me">

    <!-- Author Information -->
    <meta name="author" content="GeneBean">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <link rel="stylesheet" href="css/brands-extended.css">
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

    <script defer data-domain="genebean.me" src="/js/script.outbound-links.js"></script>

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/genebean-avatar.png 2x" alt="GeneBean's little TuxDroid avatar">

            <!-- Replace with your name or brand -->
            <h1>
              <div>GeneBean</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Find me on various apps and platforms</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Bluesky -->
              <a class="button button-bluesky" href="https://bsky.app/profile/genebean.bsky.social" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

              <!-- Dev.to -->
              <a class="button button-dev-to" href="https://dev.to/genebean" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/dev-to.svg" alt="Dev.to Logo">Dev.to</a>

              <!-- GitHub -->
              <a class="button button-github" href="https://github.com/genebean" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">GitHub</a>

              <!-- Mastodon -->
              <a class="button button-mastodon" href="https://fosstodon.org/@genebean" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/mastodon.svg" alt="Mastodon Logo">Mastodon</a>

              <!-- Medium -->
              <a class="button button-medium" href="https://medium.com/@genebean" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/medium.svg" alt="Medium Logo">Medium</a>

              <!-- Nostr -->
              <a class="button button-nostr" href="https://primal.net/p/npub1mwsk3ly4lk7efdqqjm62dkc699kqapwyyvdley3xljjm0lxruh9qzvu46p" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons-extended/nostr_logo_wht.svg" alt="ostrich">Nostr</a>

      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
